services:
  bot:
    build: .
    env_file: .env
    environment:
      API_HOST: 0.0.0.0
      TRUST_PROXY: "false"
      DATABASE_PATH: ./data/bakeu.sqlite
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - bot_data:/app/data
    restart: unless-stopped
    stop_grace_period: 50s
volumes:
  bot_data:
