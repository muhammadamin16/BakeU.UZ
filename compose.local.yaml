name: bakeu-laptop-local
services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "bakeuLaptopLocal", "--bind_ip_all"]
    ports:
      - "127.0.0.1:37117:27017"
    volumes:
      - laptop-fixtures:/data/db
      - laptop-config:/data/configdb
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - 'try { rs.status() } catch (e) { if (e.code !== 94) throw e; rs.initiate({_id:"bakeuLaptopLocal",members:[{_id:0,host:"localhost:27017"}]}) }; quit(db.hello().isWritablePrimary ? 0 : 1)'
      interval: 2s
      timeout: 5s
      retries: 45
volumes:
  laptop-fixtures:
  laptop-config:
